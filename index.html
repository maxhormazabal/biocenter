<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="BIOCENTER, centro clínico de investigación. Elige la sucursal de Concepción o Chillán para conocer sus estudios clínicos, su equipo y sus datos de contacto." />

  <link rel="icon" href="./img/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
  <link rel="stylesheet" href="./css/bootstrap.min.css" />
  <link rel="stylesheet" href="./css/all.min.css" />

  <title>BIOCENTER | Centro Clínico de Investigación</title>
</head>

<body class="linktree_body">
  <main class="linktree">
    <div class="container_linktree">

      <header class="linktree_head">
        <img src="./img/logos/logo-vertical-blanco.png" alt="BIOCENTER" />
        <p class="linktree_claim">Centro Clínico de Investigación</p>
        <p class="linktree_lead">Elige la sucursal que quieres visitar</p>
      </header>

      <!-- Las tarjetas se generan desde js/data/sedes.js — ver js/linktree.js -->
      <section class="sedes_grid" id="sedes_container"></section>

      <section class="linktree_rrss">
        <h3>síguenos en redes</h3>
        <div class="container_icons">
          <a target="_blank" rel="noopener" href="https://www.instagram.com/biocentercl/"
            aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
          <a aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
        </div>
      </section>

      <footer class="linktree_footer">
        <p>BIOCENTER forma parte de <b>Celerity Clinical Research</b></p>
      </footer>

    </div>
  </main>

  <script src="./js/data/sedes.js"></script>
  <script src="./js/linktree.js"></script>
</body>

</html>
