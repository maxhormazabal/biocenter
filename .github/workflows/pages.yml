name: Vista previa (GitHub Pages)

# Publica una vista previa del sitio en GitHub Pages desde la rama que elijas.
# Es SOLO para revisar antes de mergear: la producción real (biocenter.cl) la
# sigue desplegando deploy.yml vía el webhook de Forge al hacer push a main.
#
# Se dispara a mano (pestaña Actions -> "Vista previa (GitHub Pages)" -> Run
# workflow) para que ninguna rama publique sin querer.

on:
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama a publicar en la vista previa"
        required: true
        default: feat/chillan

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si se lanzan dos, gana la última.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar la rama elegida
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}

      # IMPORTANTE: el bloqueo a buscadores se genera AQUÍ y nunca se versiona.
      # Si robots.txt o la meta noindex vivieran en el repo, viajarían con el
      # merge a main y desindexarían biocenter.cl de Google.
      - name: Bloquear indexación de la vista previa
        run: |
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          for f in *.html; do
            sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex, nofollow" />|' "$f"
          done
          echo "Páginas con noindex:"
          grep -c 'noindex' *.html

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
